kind: ScreenRun
schema_version: 1
data:
  market: krx
  security_type: etf
  as_of: "2026-05-07"
pipeline:
  - id: source.daily_bars
    params:
      market: krx
      security_type: etf
      lookback_days: 30
  - id: transform.window_metrics
    params:
      metrics:
        avg_traded_amount_20d:
          id: average
          params:
            field: traded_amount
            window: 20
  - id: transform.latest_per_symbol
  - id: filter.field
    params:
      field: avg_traded_amount_20d
      op: gte
      value: 1000000000
  - id: rank.by_field
    params:
      field: avg_traded_amount_20d
      order: desc
  - id: limit.count
    params:
      count: 30

