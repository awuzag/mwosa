kind: Strategy
schema_version: 1
name: sma-cross
description: Simple SMA trend strategy for canonical daily bar smoke tests.
indicators:
  trend:
    id: sma
    source:
      price: close
    params:
      window: 20
  rsi14:
    id: rsi
    source:
      price: close
    params:
      window: 14
entry:
  all:
    - crosses_above:
        - price: close
        - ref: trend
    - gt:
        - ref: rsi14
        - value: 50
exit:
  crosses_below:
    - price: close
    - ref: trend
sizing:
  type: percent_of_equity
  value: 50
risk:
  max_positions: 3
  max_symbol_weight_pct: 60
---
kind: BacktestRun
schema_version: 1
name: sma-cross-krx-etf
strategy:
  name: sma-cross
data:
  market: krx
  timeframe: 1d
  from: 2024-01-01
  to: 2024-12-31
universe:
  pipeline:
    - id: source.symbols
      params:
        symbols: ["069500"]
        fields:
          market: krx
          security_type: etf
portfolio:
  initial_cash: 10000000
  currency: KRW
execution:
  fill: next_open
  commission:
    type: bps
    value: 1.5
  slippage:
    type: bps
    value: 0
report:
  metrics:
    - total_return
    - max_drawdown
    - trade_count
    - win_rate
