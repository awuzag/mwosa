kind: Strategy
schema_version: 1
name: turtle-breakout
description: Donchian breakout trend-following strategy with long-term trend, relative strength, and ATR volatility stop filters.
indicators:
  long_trend:
    id: sma
    source:
      price: close
    params:
      window: 100
  momentum_60:
    id: roc
    source:
      price: close
    params:
      window: 60
  entry_channel:
    id: donchian_high
    source:
      price: high
    params:
      window: 20
  exit_channel:
    id: donchian_low
    source:
      price: low
    params:
      window: 10
  atr14:
    id: atr
    source:
      price: close
    params:
      window: 14
entries:
  - all:
      - gt:
          - price: close
          - ref: long_trend
      - gt:
          - ref: momentum_60
          - value: 0
      - lte:
          - rank:
              - ref: momentum_60
          - value: 2
      - gte:
          - price: high
          - ref: entry_channel
      - gt:
          - portfolio: cash_pct
          - value: 20
exits:
  - lte:
      - price: low
      - ref: exit_channel
stops:
  - volatility_stop:
      - ref: atr14
      - value: 2
sizing:
  type: percent_of_equity
  value: 25
risk:
  max_positions: 4
  max_symbol_weight_pct: 30
---
kind: BacktestRun
schema_version: 1
name: turtle-breakout-krx-etf
strategy:
  name: turtle-breakout
data:
  market: krx
  timeframe: 1d
  from: 2024-01-01
  to: 2024-12-31
universe:
  pipeline:
    - id: source.symbols
      params:
        symbols: ["069500", "102110", "229200"]
        fields:
          market: krx
          security_type: etf
portfolio:
  initial_cash: 10000000
  currency: KRW
execution:
  fill: next_open
  commission:
    type: bps
    value: 1.5
  slippage:
    type: spread_proxy
    value: 0.25
report:
  metrics:
    preset: research
