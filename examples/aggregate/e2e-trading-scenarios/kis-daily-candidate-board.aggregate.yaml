kind: Aggregate
schema_version: 1
name: kis-daily-candidate-board
description: KIS 일봉 raw와 로컬 종목/밸류에이션을 합성한 HTS 후보 관찰 테이블

params:
  as_of:
    type: date
    default: "2026-07-01"
  from:
    type: date
    default: "2026-06-01"
  limit:
    type: int
    default: 20

workspace:
  ttl: 24h

pipeline:
  - name: universe
    type: local_collection
    collection: instruments
    filter:
      market_key: krx
      security_type: stock
      extensions.marketTypeName:
        $in: [KOSPI, KOSDAQ]

  - name: daily_raw
    type: provider_raw
    provider: kis
    operation: inquire-daily-itemchartprice
    foreach:
      stage: universe
      field: symbol
      as: symbol
    params:
      FID_INPUT_ISCD: "${each.symbol}"
      FID_INPUT_DATE_1: "${params.from}"
      FID_INPUT_DATE_2: "${params.as_of}"
      FID_PERIOD_DIV_CODE: D

  - name: daily_flat
    type: jq
    from: daily_raw
    query: |
      map({
        symbol: .context.symbol,
        rows: (.payload.output2 // .payload.output // [])
      })

  - name: valuation
    type: local_collection
    collection: valuation_snapshots
    filter:
      as_of_date: "${params.as_of}"

  - name: board
    type: aggregate
    from: universe
    pipeline:
      - $lookup:
          from: daily_flat
          localField: symbol
          foreignField: symbol
          as: daily
      - $lookup:
          from: valuation
          localField: symbol
          foreignField: symbol
          as: valuation
      - $addFields:
          daily_rows:
            $ifNull: [{ $first: "$daily.rows" }, []]
          market_cap_trillion:
            $divide:
              - { $ifNull: [{ $first: "$valuation.market_cap_minor" }, 0] }
              - 1000000000000
          turnover_100m:
            $divide: [{ $ifNull: ["$traded_amount", 0] }, 100000000]
          relative_volume_20d:
            $ifNull: ["$relative_volume_20d", 0]
          high_52w_pct:
            $ifNull: ["$high_52w_pct", 0]
          close_position_pct:
            $ifNull: ["$close_position_pct", 0]
          rsi_14:
            $ifNull: ["$rsi_14", 0]
          adx_14:
            $ifNull: ["$adx_14", 0]
          atr_pct_14:
            $ifNull: ["$atr_pct_14", 0]
          trend:
            $ifNull: ["$trend", "pipeline-defined"]
          label:
            $ifNull: ["$label", "watch"]
      - $sort:
          turnover_100m: -1
      - $limit: "${params.limit}"

  - name: shaped
    type: jq
    from: board
    query: |
      map({
        symbol,
        name,
        market: (.extensions.marketTypeName // .market_type // ""),
        change_pct,
        market_cap_trillion,
        turnover_100m,
        relative_volume_20d,
        high_52w_pct,
        close_position_pct,
        rsi_14,
        adx_14,
        atr_pct_14,
        trend,
        label
      })

output:
  from: shaped
  default_format: table
  sort:
    - field: turnover_100m
      order: desc
    - field: change_pct
      order: desc
  columns:
    - key: ordinal
      title: "#"
      format: integer
      align: right
    - key: symbol
      title: 코드
      align: center
    - key: name
      title: 종목
      align: left
    - key: market
      title: 시장
      align: center
    - key: change_pct
      title: 등락%
      format: percent
      precision: 2
      align: right
    - key: market_cap_trillion
      title: 시총(조)
      format: number
      precision: 2
      align: right
    - key: turnover_100m
      title: 거래대금(억)
      format: number
      precision: 0
      align: right
    - key: relative_volume_20d
      title: 거래량x20
      format: number
      precision: 1
      align: right
    - key: high_52w_pct
      title: 52주고점%
      format: percent
      precision: 1
      align: right
    - key: close_position_pct
      title: 종가위치%
      format: percent
      precision: 1
      align: right
    - key: rsi_14
      title: RSI
      format: number
      precision: 1
      align: right
    - key: adx_14
      title: ADX
      format: number
      precision: 1
      align: right
    - key: atr_pct_14
      title: ATR%
      format: percent
      precision: 1
      align: right
    - key: trend
      title: 추세
      align: center
    - key: label
      title: 메모/라벨
      align: left
